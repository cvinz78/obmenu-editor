<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="400" viewBox="0 0 1500 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1f0d"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cff9c"/>
      <stop offset="1" stop-color="#4a78a8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1500" height="400" fill="url(#bg)"/>
  <rect y="388" width="1500" height="12" fill="url(#accent)"/>

  <!-- Menü-Baum Motiv links -->
  <g transform="translate(110,60)" filter="url(#soft)">
    <rect width="360" height="280" rx="10" fill="#181818" stroke="#3c3c3c" stroke-width="2"/>
    <rect width="360" height="44" rx="10" fill="#202020"/>
    <rect y="34" width="360" height="10" fill="#202020"/>
    <circle cx="22" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="22" r="6" fill="#27c93f"/>
    <text x="180" y="28" font-family="monospace" font-size="15" fill="#9cff9c" text-anchor="middle">menu.xml</text>

    <g font-family="sans-serif" font-size="17" fill="#9cff9c">
      <rect x="24" y="64" width="248" height="30" rx="4" fill="#2d4a3e"/>
      <text x="40" y="85">▸ Terminal</text>
      <rect x="52" y="102" width="236" height="28" rx="4" fill="#222222"/>
      <text x="68" y="122">Xterm</text>
      <rect x="52" y="136" width="236" height="28" rx="4" fill="#222222"/>
      <text x="68" y="156">Htop</text>
      <rect x="24" y="178" width="248" height="30" rx="4" fill="#2d4a3e"/>
      <text x="40" y="199">▸ Netzwerk</text>
      <rect x="24" y="218" width="248" height="3" fill="#3c3c3c"/>
      <rect x="24" y="232" width="248" height="30" rx="4" fill="#2d4a3e" opacity="0.55"/>
      <text x="40" y="253" opacity="0.8">Webbrowser</text>
    </g>
  </g>

  <!-- Titel -->
  <g transform="translate(540,0)">
    <text x="0" y="185" font-family="sans-serif" font-weight="bold" font-size="86" fill="#9cff9c">Obmenu-Editor</text>
    <rect x="4" y="210" width="640" height="6" rx="3" fill="url(#accent)"/>
    <text x="4" y="262" font-family="sans-serif" font-size="30" fill="#c9e8c9">Openbox Menu Editor · PyQt6 Edition</text>
    <text x="4" y="308" font-family="sans-serif" font-size="22" fill="#7fae7f">Drag &amp; Drop · Themes · .desktop-Import · XML-Validierung</text>
  </g>
</svg>
